name: Update Deals

on:
  schedule:
    # Every 6 hours at minute 0 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger (used to verify the pipeline end-to-end)

permissions:
  contents: write

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape offers
        run: python scraper.py

      - name: Build site
        run: python build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        # deploy_serverbudget.py stamps the current UTC timestamp/date into
        # live-site/index.html and runs `wrangler pages deploy`. The Cloudflare
        # API token is supplied ONLY via this secret/env var -- it is never
        # written to a file, commit, log, or report.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9df8ad2d00106264486023cda43088b6"
        run: |
          export PATH="$PATH:$(npm prefix -g)/bin"
          python deploy_serverbudget.py
